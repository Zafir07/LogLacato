# Migrations do banco do LogLacto (Alembic).
# A URL do banco vem de DATABASE_URL (ver app/core/config.py), nunca deste arquivo.
#
#   alembic upgrade head            aplica todas as migrations
#   alembic downgrade -1            desfaz a última
#   alembic revision --autogenerate -m "descrição"   gera uma nova a partir dos modelos

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
