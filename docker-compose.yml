# LogLacto — arquitetura de serviços em servidor próprio (sem AWS)
#
#   1. copie .env.example para .env e troque as senhas
#   2. docker compose up -d --build
#   3. abra http://localhost/health
#
# Cada serviço substitui um serviço da AWS do Capítulo 8 do relatório
# (tabela completa em docs/architecture/servicos.md):
#
#   proxy     Caddy          ← API Gateway + CloudFront
#   api       FastAPI        ← ECS (Fargate)
#   quality   worker Python  ← Lambda de qualidade
#   notifier  worker Python  ← SNS
#   mosquitto Mosquitto      ← IoT Core + EventBridge
#   postgres  PostgreSQL     ← RDS
#   backup    pg_dump        ← backups do RDS
#   mailpit   Mailpit        ← caixa de e-mail de teste (só desenvolvimento)
#
# Redes:
#   edge     o que fica de frente para fora (proxy, broker)
#   internal só entre serviços; o banco fica apenas aqui (papel da sub-rede privada)

name: loglacto

x-backend-image: &backend-image
  build:
    context: ./backend
    dockerfile: ../infrastructure/docker/backend.Dockerfile
  image: loglacto-backend:dev
  restart: unless-stopped

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MQTT_HOST: mosquitto
  MQTT_PORT: 1883

services:

  # ------------------------------------------------------------ entrada
  proxy:
    # Compila o painel React (frontend/) e o serve junto com o Caddy.
    build:
      context: .
      dockerfile: infrastructure/docker/proxy.Dockerfile
    image: loglacto-proxy:dev
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

  # ------------------------------------------------------------ aplicação
  api:
    <<: *backend-image
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MQTT_BACKEND_USER: ${MQTT_BACKEND_USER}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      REQUIRED_SERVICES: svc-quality,svc-notifier
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      SEED_DEMO: ${SEED_DEMO:-true}
      LIVE_WINDOW_S: ${LIVE_WINDOW_S:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Só para os testes de integração rodarem dentro do container.
      # Em produção, remova: a API não precisa das senhas dos dispositivos nem dos workers.
      MQTT_DEVICE_CREDENTIALS: ${MQTT_DEVICE_CREDENTIALS:-}
      MQTT_QUALITY_PASSWORD: ${MQTT_QUALITY_PASSWORD}
      MQTT_NOTIFIER_PASSWORD: ${MQTT_NOTIFIER_PASSWORD}
      MAILPIT_URL: http://mailpit:8025
    volumes:
      - files:/data/files
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    # Acesso direto à API só a partir deste computador (depuração). Use o proxy.
    ports:
      - "127.0.0.1:8000:8000"
    networks: [edge, internal]

  quality:
    <<: *backend-image
    command: ["python", "-m", "app.workers.quality"]
    environment:
      <<: *common-env
      MQTT_SERVICE_USER: svc-quality
      MQTT_SERVICE_PASSWORD: ${MQTT_QUALITY_PASSWORD:?defina MQTT_QUALITY_PASSWORD no .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QUALITY_OPEN_AFTER: ${QUALITY_OPEN_AFTER:-2}
      QUALITY_CLOSE_AFTER: ${QUALITY_CLOSE_AFTER:-3}
      NO_DATA_MINUTES: ${NO_DATA_MINUTES:-5}
      INVALID_STREAK: ${INVALID_STREAK:-3}
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "svc-quality"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  notifier:
    <<: *backend-image
    command: ["python", "-m", "app.workers.notifier"]
    environment:
      <<: *common-env
      MQTT_SERVICE_USER: svc-notifier
      MQTT_SERVICE_PASSWORD: ${MQTT_NOTIFIER_PASSWORD:?defina MQTT_NOTIFIER_PASSWORD no .env}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-LogLacto <alertas@loglacto.local>}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      NOTIFY_MIN_SEVERITY: ${NOTIFY_MIN_SEVERITY:-atencao}
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "svc-notifier"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      mosquitto:
        condition: service_started
    networks: [internal]

  # ------------------------------------------------------------ mensageria
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
      MQTT_BACKEND_USER: ${MQTT_BACKEND_USER:?defina MQTT_BACKEND_USER no .env}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?defina MQTT_BACKEND_PASSWORD no .env}
      MQTT_QUALITY_PASSWORD: ${MQTT_QUALITY_PASSWORD:?defina MQTT_QUALITY_PASSWORD no .env}
      MQTT_NOTIFIER_PASSWORD: ${MQTT_NOTIFIER_PASSWORD:?defina MQTT_NOTIFIER_PASSWORD no .env}
      MQTT_DEVICE_CREDENTIALS: ${MQTT_DEVICE_CREDENTIALS:-}
    # O script gera senhas e ACL a partir do .env antes de iniciar o broker.
    entrypoint: ["sh", "/mosquitto/config/docker-entrypoint.sh"]
    volumes:
      - ./infrastructure/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/mqtt/acl.template:/mosquitto/config/acl.template:ro
      - ./infrastructure/mqtt/docker-entrypoint.sh:/mosquitto/config/docker-entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
    # Aberto na rede local: a T-Beam conecta pelo IP deste computador.
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u \"$$MQTT_BACKEND_USER\" -P \"$$MQTT_BACKEND_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [edge, internal]

  # ------------------------------------------------------------ dados
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Só acessível do próprio computador (pgAdmin/DBeaver). Nunca na rede.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./infrastructure/backup/backup.sh:/backup.sh:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # ------------------------------------------------------------ simulador (opcional)
  # docker compose --profile sim up -d simulator
  simulator:
    <<: *backend-image
    profiles: [sim]
    restart: "no"
    command: ["python", "-m", "app.tools.simulator", "live", "--scenario", "${SIM_SCENARIO:-demo}"]
    environment:
      <<: *common-env
      MQTT_DEVICE_CREDENTIALS: ${MQTT_DEVICE_CREDENTIALS:-}
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  # ------------------------------------------------------------ desenvolvimento
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [internal]

networks:
  edge:
  internal:

volumes:
  pgdata:
  mosquitto_data:
  caddy_data:
  caddy_config:
  files:
