# Broker MQTT do LogLacto (Eclipse Mosquitto 2.x)
#
# Os arquivos de senha e de ACL NÃO ficam no repositório: o script
# docker-entrypoint.sh gera os dois em /mosquitto/data a cada inicialização,
# a partir das variáveis do .env.

# ---------- Ouvinte local (desenvolvimento, rede da sala/laboratório) ----------
# Sem TLS. Use apenas em rede local controlada.
listener 1883

# ---------- Ouvinte com TLS (produção / rede externa) ----------
# Descomente e coloque os certificados em infrastructure/mqtt/certs/
# (veja docs/installation/README.md, seção "TLS no broker").
# listener 8883
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
# tls_version tlsv1.2

# ---------- Autenticação e autorização ----------
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

# ---------- Persistência ----------
# Guarda em disco as mensagens QoS 1 pendentes e as sessões persistentes
# (o backend usa clean_session=False), para não perder leituras se o broker reiniciar.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Limite de mensagens enfileiradas por cliente desconectado
max_queued_messages 10000

# ---------- Logs ----------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
